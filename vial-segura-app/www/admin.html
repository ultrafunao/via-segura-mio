<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Vía Segura</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <style>
    :root {
      --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
      --ease-out: cubic-bezier(0, 0, 0.2, 1);
      --dur-fast: 150ms;
      --dur-mid: 250ms;
      --dur-slow: 400ms;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f1a; color: #fff; min-height: 100vh;
    }

    /* ── SPLASH ── */
    #admin-splash {
      position: fixed; inset: 0; z-index: 9999;
      background: #0f0f1a;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      transition: opacity 0.5s var(--ease-smooth), transform 0.5s var(--ease-smooth);
    }
    #admin-splash.hidden { opacity: 0; transform: scale(1.04); pointer-events: none; }
    #admin-splash i {
      font-size: 48px; color: #5DCAA5;
      animation: iconPop 0.6s var(--ease-bounce) 0.2s both;
    }
    #admin-splash .stitle {
      font-size: 18px; font-weight: 600; color: #fff;
      animation: fadeUp 0.5s var(--ease-out) 0.4s both;
    }
    #admin-splash .sbar {
      width: 100px; height: 2px; background: #2a2a4a; border-radius: 99px; overflow: hidden;
      animation: fadeUp 0.5s var(--ease-out) 0.55s both;
    }
    #admin-splash .sbar-fill {
      height: 100%; background: linear-gradient(90deg, #5DCAA5, #185FA5);
      animation: fillBar 1.2s var(--ease-smooth) 0.6s both;
    }
    @keyframes iconPop {
      from { opacity:0; transform:scale(0.4) rotate(-20deg); }
      to   { opacity:1; transform:scale(1) rotate(0deg); }
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(10px); }
      to   { opacity:1; transform:translateY(0); }
    }
    @keyframes fillBar { from { width:0%; } to { width:100%; } }

    /* ── TOPBAR ── */
    .topbar {
      background: #1a1a2e; padding: 16px 24px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid #2a2a4a;
      animation: slideDown 0.4s var(--ease-out) both;
    }
    @keyframes slideDown {
      from { transform:translateY(-100%); opacity:0; }
      to   { transform:translateY(0); opacity:1; }
    }
    .topbar-title { font-size: 18px; font-weight: 600; color: #5DCAA5; }
    .logout-btn {
      padding: 6px 14px; border-radius: 8px; border: 1px solid #E24B4A;
      background: transparent; color: #E24B4A; cursor: pointer; font-size: 13px;
      transition: all var(--dur-mid) var(--ease-smooth);
    }
    .logout-btn:hover { background: #E24B4A; color: #fff; transform: scale(1.04); }
    .logout-btn:active { transform: scale(0.96); }

    /* ── TOAST ── */
    #toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: #27272a; color: #fff; padding: 10px 18px; border-radius: 24px;
      font-size: 12px; font-weight: 500; z-index: 999; white-space: nowrap;
      transition: transform 0.35s var(--ease-bounce), opacity 0.3s;
      opacity: 0; pointer-events: none; display: flex; align-items: center; gap: 6px;
    }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* ── LOGIN ── */
    .login-wrap {
      display: flex; align-items: center; justify-content: center; min-height: 100vh;
    }
    .login-card {
      background: #1a1a2e; border-radius: 16px; padding: 32px; width: 320px;
      border: 1px solid #2a2a4a;
      animation: loginCardEnter 0.6s var(--ease-bounce) 0.1s both;
    }
    @keyframes loginCardEnter {
      from { opacity:0; transform:scale(0.88) translateY(24px); }
      to   { opacity:1; transform:scale(1) translateY(0); }
    }
    .login-title { font-size: 20px; font-weight: 600; margin-bottom: 6px; color: #5DCAA5; }
    .login-sub   { font-size: 13px; color: #71717a; margin-bottom: 24px; }
    .input {
      width: 100%; padding: 10px 12px; border-radius: 8px;
      border: 1px solid #2a2a4a; background: #0f0f1a; color: #fff;
      font-size: 13px; margin-bottom: 12px;
      transition: border-color var(--dur-fast) var(--ease-smooth),
                  box-shadow var(--dur-fast) var(--ease-smooth),
                  transform var(--dur-fast);
    }
    .input:focus {
      outline: none; border-color: #185FA5;
      box-shadow: 0 0 0 3px rgba(24,95,165,0.18);
      transform: translateY(-1px);
    }
    .btn {
      width: 100%; padding: 12px; border-radius: 8px;
      border: none; background: #185FA5; color: #fff;
      font-size: 14px; font-weight: 500; cursor: pointer;
      position: relative; overflow: hidden;
      transition: transform var(--dur-fast) var(--ease-bounce),
                  box-shadow var(--dur-fast), background var(--dur-fast);
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(24,95,165,0.35); }
    .btn:active { transform: scale(0.97); }
    .btn.loading { pointer-events: none; opacity: 0.75; }
    .btn.loading::after {
      content:''; position:absolute; inset:0;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);
      background-size:200% 100%;
      animation:shimmer 1s infinite;
    }
    @keyframes shimmer { from{background-position:-200% 0} to{background-position:200% 0} }
    .btn.success { background: #639922; }

    /* ── SPINNER ── */
    .spinner {
      width:16px; height:16px; border-radius:50%;
      border:2px solid rgba(255,255,255,0.3);
      border-top-color:#fff;
      animation:spin 0.7s linear infinite;
      display:inline-block;
    }
    @keyframes spin { to{transform:rotate(360deg)} }

    .error-msg { color: #E24B4A; font-size: 12px; margin-top: 8px; text-align: center; }

    /* ── DASHBOARD ── */
    .dashboard { display: none; padding: 24px; animation: dashIn 0.5s var(--ease-out) both; }
    @keyframes dashIn {
      from { opacity:0; transform:translateY(16px); }
      to   { opacity:1; transform:translateY(0); }
    }

    /* ── STATS ── */
    .stats {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px; margin-bottom: 24px;
    }
    .stat-card {
      background: #1a1a2e; border-radius: 12px; padding: 16px; border: 1px solid #2a2a4a;
      animation: statPop var(--dur-slow) var(--ease-bounce) both;
      transition: transform var(--dur-mid) var(--ease-bounce), box-shadow var(--dur-mid), border-color var(--dur-mid);
    }
    .stat-card:hover { transform: translateY(-4px) scale(1.02); box-shadow: 0 12px 32px rgba(0,0,0,0.3); border-color: #185FA5; }
    .stat-card:nth-child(1) { animation-delay:0.1s; }
    .stat-card:nth-child(2) { animation-delay:0.18s; }
    .stat-card:nth-child(3) { animation-delay:0.26s; }
    @keyframes statPop {
      from { opacity:0; transform:scale(0.85) translateY(12px); }
      to   { opacity:1; transform:scale(1) translateY(0); }
    }
    .stat-val  { font-size: 32px; font-weight: 600; color: #5DCAA5; }
    .stat-lbl  { font-size: 12px; color: #71717a; margin-top: 4px; }

    /* ── TABLE WRAP ── */
    .table-wrap {
      background: #1a1a2e; border-radius: 12px; border: 1px solid #2a2a4a;
      overflow: hidden;
      animation: fadeUp 0.5s var(--ease-out) 0.3s both;
    }
    .table-head {
      padding: 16px 20px; display: flex;
      justify-content: space-between; align-items: center;
      border-bottom: 1px solid #2a2a4a;
    }
    .table-head h3 { font-size: 15px; font-weight: 500; }
    .del-all-btn {
      padding: 6px 14px; border-radius: 8px; border: 1px solid #E24B4A;
      background: transparent; color: #E24B4A; cursor: pointer; font-size: 12px;
      transition: all var(--dur-mid) var(--ease-smooth);
    }
    .del-all-btn:hover { background: #E24B4A; color: #fff; transform: scale(1.04); }
    .del-all-btn:active { transform: scale(0.96); }

    /* ── FILTERS ── */
    .filters {
      padding: 12px 16px; display: flex; gap: 10px; flex-wrap: wrap;
      border-bottom: 1px solid #2a2a4a;
      animation: fadeUp 0.4s var(--ease-out) 0.4s both;
    }
    .filter-select {
      padding: 6px 10px; border-radius: 8px; border: 1px solid #2a2a4a;
      background: #0f0f1a; color: #fff; font-size: 12px;
      transition: all var(--dur-fast) var(--ease-smooth); cursor: pointer;
    }
    .filter-select:focus { outline: none; border-color: #185FA5; box-shadow: 0 0 0 2px rgba(24,95,165,0.2); }
    .clear-btn {
      padding: 6px 12px; border-radius: 8px; border: 1px solid #2a2a4a;
      background: transparent; color: #71717a; font-size: 12px; cursor: pointer;
      transition: all var(--dur-mid) var(--ease-smooth);
    }
    .clear-btn:hover { border-color: #5DCAA5; color: #5DCAA5; }

    /* ── TABLE ── */
    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left; padding: 12px 16px;
      font-size: 11px; color: #71717a; font-weight: 500;
      border-bottom: 1px solid #2a2a4a; text-transform: uppercase; letter-spacing: 0.05em;
    }
    td {
      padding: 12px 16px; font-size: 13px;
      border-bottom: 1px solid #151520; vertical-align: top;
      transition: background var(--dur-fast);
    }
    tbody tr {
      animation: rowSlide 0.35s var(--ease-out) both;
      transition: background var(--dur-fast);
    }
    tbody tr:nth-child(1)  { animation-delay:0.02s; }
    tbody tr:nth-child(2)  { animation-delay:0.05s; }
    tbody tr:nth-child(3)  { animation-delay:0.08s; }
    tbody tr:nth-child(4)  { animation-delay:0.11s; }
    tbody tr:nth-child(5)  { animation-delay:0.14s; }
    tbody tr:nth-child(6)  { animation-delay:0.17s; }
    tbody tr:nth-child(7)  { animation-delay:0.20s; }
    tbody tr:nth-child(8)  { animation-delay:0.23s; }
    tbody tr:nth-child(9)  { animation-delay:0.26s; }
    tbody tr:nth-child(10) { animation-delay:0.29s; }
    @keyframes rowSlide {
      from { opacity:0; transform:translateX(-10px); }
      to   { opacity:1; transform:translateX(0); }
    }
    tr:hover td { background: #1f1f35; }
    .del-btn {
      padding: 4px 10px; border-radius: 6px;
      border: 1px solid #E24B4A; background: transparent;
      color: #E24B4A; cursor: pointer; font-size: 11px;
      transition: all var(--dur-fast) var(--ease-bounce);
    }
    .del-btn:hover { background: #E24B4A; color: #fff; transform: scale(1.08); }
    .del-btn:active { transform: scale(0.93); }

    /* Delete with fade-out */
    tr.deleting { animation: rowDelete 0.35s var(--ease-in) forwards; pointer-events:none; }
    @keyframes rowDelete {
      from { opacity:1; transform:translateX(0); max-height:60px; }
      to   { opacity:0; transform:translateX(20px); max-height:0; }
    }

    .badge { padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 500; background: #FCEBEB; color: #A32D2D; }
    .empty { padding: 40px; text-align: center; color: #71717a; font-size: 13px; animation: fadeUp 0.4s var(--ease-out) both; }

    /* ── SKELETON ── */
    .skeleton {
      border-radius: 6px;
      background: linear-gradient(90deg, #1a1a2e 25%, #22223a 50%, #1a1a2e 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }

    /* ── CONFIRM MODAL ── */
    #confirm-modal {
      position: fixed; inset: 0; z-index: 9998;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s var(--ease-smooth);
    }
    #confirm-modal.show { opacity: 1; pointer-events: all; }
    #confirm-modal .modal-card {
      background: #1a1a2e; border-radius: 16px; padding: 24px; width: 300px;
      border: 1px solid #2a2a4a;
      transform: scale(0.9) translateY(20px);
      transition: transform 0.3s var(--ease-bounce);
    }
    #confirm-modal.show .modal-card { transform: scale(1) translateY(0); }
    #confirm-modal .modal-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
    #confirm-modal .modal-sub   { font-size: 13px; color: #71717a; margin-bottom: 20px; }
    #confirm-modal .modal-btns  { display: flex; gap: 10px; }
    #confirm-modal .modal-btns button {
      flex: 1; padding: 10px; border-radius: 8px; font-size: 13px; cursor: pointer;
      transition: all var(--dur-mid) var(--ease-bounce);
    }
    #confirm-modal .modal-btns button:first-child {
      border: 1px solid #2a2a4a; background: transparent; color: #a1a1aa;
    }
    #confirm-modal .modal-btns button:first-child:hover { border-color: #5DCAA5; color: #5DCAA5; }
    #confirm-modal .modal-btns button:last-child {
      border: none; background: #E24B4A; color: #fff;
    }
    #confirm-modal .modal-btns button:last-child:hover { transform: scale(1.04); box-shadow: 0 4px 14px rgba(226,75,74,0.4); }

    /* ── REFRESH INDICATOR ── */
    .refresh-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #5DCAA5; display: inline-block; margin-right: 6px;
      animation: dotPulse 2s ease-in-out infinite;
    }
    @keyframes dotPulse {
      0%,100% { opacity:1; transform:scale(1); }
      50%      { opacity:0.4; transform:scale(0.7); }
    }
  </style>
</head>
<body>

<!-- SPLASH -->
<div id="admin-splash">
  <i class="ti ti-shield-lock"></i>
  <div class="stitle">Panel Admin</div>
  <div class="sbar"><div class="sbar-fill"></div></div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- CONFIRM MODAL -->
<div id="confirm-modal">
  <div class="modal-card">
    <div class="modal-title" id="modal-title">¿Eliminar reporte?</div>
    <div class="modal-sub" id="modal-sub">Esta acción no se puede deshacer.</div>
    <div class="modal-btns">
      <button onclick="closeModal()">Cancelar</button>
      <button id="modal-confirm-btn" onclick="confirmAction()"><i class="ti ti-trash"></i> Eliminar</button>
    </div>
  </div>
</div>

<div class="topbar" id="topbar" style="display:none">
  <div class="topbar-title"><i class="ti ti-shield-lock"></i> Vía Segura Admin</div>
  <div style="display:flex;align-items:center;gap:12px">
    <span style="font-size:11px;color:#71717a;display:flex;align-items:center">
      <span class="refresh-dot"></span>En vivo
    </span>
    <button class="logout-btn" onclick="logout()"><i class="ti ti-logout"></i> Cerrar sesión</button>
  </div>
</div>

<!-- LOGIN -->
<div class="login-wrap" id="login-section">
  <div class="login-card">
    <div class="login-title"><i class="ti ti-shield-lock"></i> Panel Admin</div>
    <div class="login-sub">Acceso restringido — Solo administradores</div>
    <input class="input" type="text" id="admin-user" placeholder="Usuario" autocomplete="username">
    <input class="input" type="password" id="admin-pass" placeholder="Contraseña" autocomplete="current-password"
      onkeydown="if(event.key==='Enter') doAdminLogin()">
    <button class="btn" id="login-btn" onclick="doAdminLogin()">Ingresar</button>
    <div class="error-msg" id="login-error"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="admin-dashboard">
  <div class="stats">
    <div class="stat-card">
      <div class="stat-val" id="a-total">—</div>
      <div class="stat-lbl">Total reportes</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="a-hoy">—</div>
      <div class="stat-lbl">Reportes hoy</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="a-semana">—</div>
      <div class="stat-lbl">Esta semana</div>
    </div>
  </div>
  <div class="table-wrap">
    <div class="table-head">
      <h3>Todos los reportes</h3>
      <button class="del-all-btn" onclick="askDeleteAll()"><i class="ti ti-trash"></i> Eliminar todos</button>
    </div>
    <div class="filters">
      <select id="filter-tipo" class="filter-select" onchange="applyFilters()">
        <option value="">Todos los tipos</option>
        <option value="Cruce ilegal">Cruce ilegal</option>
        <option value="Casi-accidente">Casi-accidente</option>
        <option value="Peatón en riesgo">Peatón en riesgo</option>
        <option value="Otro">Otro</option>
      </select>
      <select id="filter-fecha" class="filter-select" onchange="applyFilters()">
        <option value="">Todas las fechas</option>
        <option value="hoy">Hoy</option>
        <option value="semana">Esta semana</option>
        <option value="mes">Este mes</option>
      </select>
      <button class="clear-btn" onclick="clearFilters()">Limpiar filtros</button>
    </div>
    <div id="table-body">
      <!-- Skeleton loaders -->
      <div style="padding:16px;display:flex;flex-direction:column;gap:10px">
        <div class="skeleton" style="height:40px;border-radius:6px"></div>
        <div class="skeleton" style="height:40px;border-radius:6px"></div>
        <div class="skeleton" style="height:40px;border-radius:6px"></div>
        <div class="skeleton" style="height:40px;border-radius:6px"></div>
      </div>
    </div>
  </div>
</div>

<script>
const API = 'https://via-segura-mio.vercel.app/api/admin';
let token = localStorage.getItem('adminToken');
let pendingAction = null;
let allReports = [];

// ── SPLASH ──
window.addEventListener('load', () => {
  setTimeout(() => {
    document.getElementById('admin-splash').classList.add('hidden');
    setTimeout(() => document.getElementById('admin-splash').remove(), 600);
  }, 1800);
});

// ── TOAST ──
function showToast(msg, icon = '✓', duration = 2800) {
  const el = document.getElementById('toast');
  el.innerHTML = `<span>${icon}</span> ${msg}`;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), duration);
}

// ── COUNTER ──
function animateCounter(el, target) {
  const start = 0;
  const dur = 700, step = 16;
  let cur = start;
  const inc = target / (dur / step);
  const timer = setInterval(() => {
    cur += inc;
    if (cur >= target) { el.textContent = target; clearInterval(timer); return; }
    el.textContent = Math.round(cur);
  }, step);
}

// ── CONFIRM MODAL ──
function showModal(title, sub, action) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-sub').textContent = sub;
  pendingAction = action;
  document.getElementById('confirm-modal').classList.add('show');
}
function closeModal() {
  document.getElementById('confirm-modal').classList.remove('show');
  pendingAction = null;
}
function confirmAction() {
  if (pendingAction) pendingAction();
  closeModal();
}

// ── LOGIN ──
async function doAdminLogin() {
  const username = document.getElementById('admin-user').value;
  const password = document.getElementById('admin-pass').value;
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');

  btn.classList.add('loading');
  btn.innerHTML = '<div class="spinner"></div>';
  errEl.textContent = '';

  try {
    const res = await fetch(API + '/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    if (!res.ok) {
      btn.classList.remove('loading');
      btn.innerHTML = 'Ingresar';
      // Shake animation
      const card = document.querySelector('.login-card');
      card.style.animation = 'none';
      card.style.transform = 'translateX(0)';
      const shakeFrames = [
        {transform:'translateX(-8px)'},{transform:'translateX(8px)'},
        {transform:'translateX(-6px)'},{transform:'translateX(6px)'},
        {transform:'translateX(0)'}
      ];
      card.animate(shakeFrames, { duration: 400, easing: 'ease-in-out' });
      errEl.textContent = 'Usuario o contraseña incorrectos';
      return;
    }
    const data = await res.json();
    token = data.token;
    localStorage.setItem('adminToken', token);
    btn.classList.remove('loading');
    btn.classList.add('success');
    btn.innerHTML = '<i class="ti ti-check"></i> ¡Acceso concedido!';
    setTimeout(showDashboard, 900);
  } catch {
    btn.classList.remove('loading');
    btn.innerHTML = 'Ingresar';
    errEl.textContent = 'Error conectando al servidor';
  }
}

function showDashboard() {
  document.getElementById('login-section').style.display = 'none';
  document.getElementById('topbar').style.display = 'flex';
  document.getElementById('admin-dashboard').style.display = 'block';
  loadReports();
}

function logout() {
  localStorage.removeItem('adminToken');
  token = null;
  document.getElementById('admin-dashboard').style.display = 'none';
  document.getElementById('topbar').style.display = 'none';
  document.getElementById('login-section').style.display = 'flex';
  showToast('Sesión cerrada', '👋');
}

async function loadReports() {
  try {
    const res = await fetch(API + '/reports', { headers: { 'Authorization': 'Bearer ' + token } });
    if (res.status === 401 || res.status === 403) { logout(); return; }
    const reports = await res.json();
    const now = new Date();
    const hoy = reports.filter(r => new Date(r.created_at).toDateString() === now.toDateString());
    const semana = reports.filter(r => (now - new Date(r.created_at)) < 7*24*60*60*1000);

    animateCounter(document.getElementById('a-total'), reports.length);
    animateCounter(document.getElementById('a-hoy'), hoy.length);
    animateCounter(document.getElementById('a-semana'), semana.length);

    allReports = reports;
    const body = document.getElementById('table-body');
    if (reports.length === 0) {
      body.innerHTML = '<div class="empty"><i class="ti ti-inbox" style="font-size:32px;display:block;margin-bottom:8px;color:#2a2a4a"></i>No hay reportes.</div>';
      return;
    }
    renderTable(reports);
  } catch {
    document.getElementById('table-body').innerHTML = '<div class="empty">Error cargando reportes.</div>';
  }
}

async function deleteReport(id, rowEl) {
  showModal('¿Eliminar reporte?', 'Esta acción no se puede deshacer.', async () => {
    if (rowEl) rowEl.classList.add('deleting');
    await new Promise(r => setTimeout(r, 350));
    await fetch(API + '/reports/' + id, {
      method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token }
    });
    showToast('Reporte eliminado', '🗑️');
    loadReports();
  });
}

function askDeleteAll() {
  showModal('¿Eliminar TODOS los reportes?', `Se eliminarán ${allReports.length} reportes permanentemente.`, async () => {
    await fetch(API + '/reports', {
      method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token }
    });
    showToast('Todos los reportes eliminados', '🗑️');
    loadReports();
  });
}

function applyFilters() {
  const tipo = document.getElementById('filter-tipo').value;
  const fecha = document.getElementById('filter-fecha').value;
  const now = new Date();
  let filtered = allReports;
  if (tipo) filtered = filtered.filter(r => r.title && r.title.includes(tipo));
  if (fecha === 'hoy') filtered = filtered.filter(r => new Date(r.created_at).toDateString() === now.toDateString());
  if (fecha === 'semana') filtered = filtered.filter(r => (now - new Date(r.created_at)) < 7*24*60*60*1000);
  if (fecha === 'mes') filtered = filtered.filter(r => (now - new Date(r.created_at)) < 30*24*60*60*1000);
  renderTable(filtered);
}

function clearFilters() {
  document.getElementById('filter-tipo').value = '';
  document.getElementById('filter-fecha').value = '';
  renderTable(allReports);
}

function renderTable(reports) {
  const body = document.getElementById('table-body');
  if (reports.length === 0) {
    body.innerHTML = '<div class="empty"><i class="ti ti-filter-off" style="font-size:24px;display:block;margin-bottom:8px;color:#2a2a4a"></i>No hay reportes con esos filtros.</div>';
    return;
  }
  body.innerHTML = `<table>
    <thead><tr>
      <th>Tipo</th><th>Vehículo</th><th>Usuario</th><th>Descripción</th><th>Foto</th><th>Coordenadas</th><th>Fecha</th><th></th>
    </tr></thead>
    <tbody>${reports.map(r => `
      <tr id="row-${r.id}">
        <td><span class="badge">${r.title||'—'}</span></td>
        <td style="color:#a1a1aa">${r.sub||'—'}</td>
        <td style="color:#a1a1aa;font-size:11px">${r.user_email||'—'}</td>
        <td style="color:#71717a;font-size:11px;max-width:150px">${r.descripcion||'—'}</td>
        <td>${r.foto_url ? `<a href="${r.foto_url}" target="_blank"><img src="${r.foto_url}" style="width:48px;height:48px;object-fit:cover;border-radius:6px"></a>` : '—'}</td>
        <td style="color:#71717a;font-size:11px">${r.lat&&r.lng?r.lat.toFixed(4)+', '+r.lng.toFixed(4):'Sin coords'}</td>
        <td style="color:#71717a;font-size:11px">${new Date(r.created_at).toLocaleString('es-CO')}</td>
        <td><button class="del-btn" onclick="deleteReport(${r.id}, document.getElementById('row-${r.id}'))"><i class="ti ti-trash"></i></button></td>
      </tr>
    `).join('')}</tbody>
  </table>`;
}

// Auto-login si ya tiene token
if (token) showDashboard();
</script>
</body>
</html>
